# Two gates, deliberately separate.
#
# Gate 1 answers exactly one question: does this build, and do the unit tests
# actually execute? Nothing about CoreText behaviour belongs here. If this job is
# red, the cause is the implementation or an API assumption — not a finding.
#
# Gate 2 is the research half: it runs the spike three times in three separate
# processes and compares the canonical fingerprints. Determinism is a
# cross-process property; comparing two layouts inside one process cannot see
# hash seeding, framework cold-start state, or environment-sensitive ordering.
# See ADR-0011.
#
# Probe findings never fail either job. A probe that comes back "no" is a result
# about the subject under test — the bundled font genuinely lacking `halt` is the
# entire point of the census. Only a thrown error (a real defect) or a fingerprint
# mismatch fails a job.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-1:
    name: Gate 1 — build and unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  gate-2:
    name: Gate 2 — spike run and cross-process determinism
    runs-on: macos-15
    needs: gate-1
    env:
      # Deliberately not the tool's own default (`./.artifacts`, which is
      # gitignored and right for local runs). `actions/upload-artifact` skips
      # hidden files, so uploading from a dot-directory silently produces
      # nothing — which is exactly what the first run of this workflow did,
      # while reporting the step as a success.
      OUT: spike-artifacts
    steps:
      - uses: actions/checkout@v6

      - name: Baseline run
        run: swift run spike-b --out "$OUT/run1"

      - name: Second process, compared against the baseline
        run: swift run spike-b --out "$OUT/run2" --expect "$OUT/run1/spike-b.fingerprint"

      - name: Third process, compared against the baseline
        run: swift run spike-b --out "$OUT/run3" --expect "$OUT/run1/spike-b.fingerprint"

      - name: Compare canonical fingerprints
        run: |
          cmp "$OUT/run1/spike-b.fingerprint" "$OUT/run2/spike-b.fingerprint"
          cmp "$OUT/run1/spike-b.fingerprint" "$OUT/run3/spike-b.fingerprint"

      # Spike A, the same shape: three processes, one baseline. Identity is
      # even more exposed to process-level drift than typography is, because
      # the payload is built from dictionary traversal and path arithmetic.
      - name: Spike A baseline run
        run: swift run spike-a --out "$OUT/a-run1"

      - name: Spike A second process, compared against its baseline
        run: swift run spike-a --out "$OUT/a-run2" --expect "$OUT/a-run1/spike-a.fingerprint"

      - name: Spike A third process, compared against its baseline
        run: swift run spike-a --out "$OUT/a-run3" --expect "$OUT/a-run1/spike-a.fingerprint"

      - name: Compare Spike A fingerprints
        run: |
          cmp "$OUT/a-run1/spike-a.fingerprint" "$OUT/a-run2/spike-a.fingerprint"
          cmp "$OUT/a-run1/spike-a.fingerprint" "$OUT/a-run3/spike-a.fingerprint"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spike-artifacts
          path: ${{ env.OUT }}/
          # `error`, not `warn`: an upload that quietly finds nothing is the
          # same failure as a review image that quietly was not written, and
          # both are indistinguishable from success in the log.
          if-no-files-found: error
